<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Command Center | Executive Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans p-6 md:p-12 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [data, setData] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            // Edit Invoice States
            const [isEditingInvoice, setIsEditingInvoice] = React.useState(false);
            const [invoiceForm, setInvoiceForm] = React.useState({ invoiceRef: '', billingPeriod: '', scope: '', amount: '' });

            // Edit Leads States
            const [isEditingLeads, setIsEditingLeads] = React.useState(false);
            const [leadsForm, setLeadsForm] = React.useState({ qualifiedLeads: '', bookedCalls: '', roi: '' });

            const loadData = () => {
                fetch('/api/all-data')
                    .then(res => res.json())
                    .then(resData => {
                        setData(resData);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error(err);
                        setLoading(false);
                    });
            };

            React.useEffect(() => {
                loadData();
            }, []);

            if (loading) {
                return <div className="text-center p-20 text-indigo-600 font-semibold tracking-wide">Loading Client Command Center...</div>;
            }

            if (!data) {
                return <div className="text-center p-20 text-rose-600 font-semibold">Error connecting to database. Please restart server.</div>;
            }

            // Handlers
            const handleSaveInvoice = () => {
                fetch('/api/invoice', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(invoiceForm)
                }).then(() => {
                    setData({ ...data, invoice: { ...data.invoice, ...invoiceForm } });
                    setIsEditingInvoice(false);
                });
            };

            const handleVideoStatus = (videoId, newStatus) => {
                fetch('/api/video/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: videoId, status: newStatus })
                }).then(() => loadData());
            };

            const handleTaskStatus = (taskId, newStatus) => {
                fetch('/api/tasks/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: taskId, status: newStatus })
                }).then(() => loadData());
            };

            const handleSaveLeads = () => {
                fetch('/api/leads', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(leadsForm)
                }).then(() => {
                    setData({ ...data, leads: { ...data.leads, ...leadsForm } });
                    setIsEditingLeads(false);
                });
            };

            return (
                <div className="max-w-6xl mx-auto space-y-8">
                    {/* Header */}
                    <header className="bg-white border border-slate-200/80 shadow-sm p-6 md:p-8 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all">
                        <div>
                            <span className="text-xs uppercase tracking-widest text-indigo-600 font-extrabold bg-indigo-50 px-3 py-1 rounded-full">Executive Portal</span>
                            <h1 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight mt-2">Client Command Center</h1>
                            <p className="text-sm text-slate-500 font-medium mt-0.5">Real-time Campaign Dashboard & Operational Hub</p>
                        </div>
                        <div className="flex items-center gap-3 bg-emerald-50 border border-emerald-200/60 px-4 py-2 rounded-2xl">
                            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span className="text-xs font-bold text-emerald-700 uppercase tracking-wide">Live & Secure</span>
                        </div>
                    </header>

                    {/* Main Grid Layout */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        {/* 1. Invoices */}
                        <div className="bg-white border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow p-6 rounded-3xl flex flex-col justify-between space-y-4">
                            <div>
                                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                    <h2 className="text-xs font-bold text-indigo-600 uppercase tracking-wider flex items-center gap-2">
                                        <span>💳</span> 1. Invoicing & Billing
                                    </h2>
                                    {!isEditingInvoice ? (
                                        <button 
                                            onClick={() => {
                                                setInvoiceForm({
                                                    invoiceRef: data.invoice?.invoiceRef || '',
                                                    billingPeriod: data.invoice?.billingPeriod || '',
                                                    scope: data.invoice?.scope || '',
                                                    amount: data.invoice?.amount || ''
                                                });
                                                setIsEditingInvoice(true);
                                            }}
                                            className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-xl transition-colors">
                                            Edit Details
                                        </button>
                                    ) : (
                                        <div className="flex gap-2">
                                            <button onClick={() => setIsEditingInvoice(false)} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold px-3 py-1.5 rounded-xl">Cancel</button>
                                            <button onClick={handleSaveInvoice} className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-3 py-1.5 rounded-xl shadow-sm">Save</button>
                                        </div>
                                    )}
                                </div>

                                {!isEditingInvoice ? (
                                    <div className="text-sm space-y-2.5 text-slate-600 mt-4">
                                        <p><strong className="text-slate-900">Reference:</strong> {data.invoice?.invoiceRef}</p>
                                        <p><strong className="text-slate-900">Billing Period:</strong> {data.invoice?.billingPeriod}</p>
                                        <p><strong className="text-slate-900">Scope of Work:</strong> {data.invoice?.scope}</p>
                                        <div className="flex justify-between items-center pt-3 border-t border-slate-100">
                                            <span className="text-lg font-extrabold text-indigo-600">{data.invoice?.amount}</span>
                                            <span className="bg-amber-50 text-amber-800 border border-amber-200/60 text-xs font-bold px-3 py-1 rounded-full">{data.invoice?.status}</span>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-3 mt-4 text-xs">
                                        <div>
                                            <label className="text-slate-500 font-semibold">Reference ID:</label>
                                            <input type="text" value={invoiceForm.invoiceRef} onChange={e => setInvoiceForm({...invoiceForm, invoiceRef: e.target.value})} className="w-full mt-1 bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                        </div>
                                        <div>
                                            <label className="text-slate-500 font-semibold">Billing Period:</label>
                                            <input type="text" value={invoiceForm.billingPeriod} onChange={e => setInvoiceForm({...invoiceForm, billingPeriod: e.target.value})} className="w-full mt-1 bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                        </div>
                                        <div>
                                            <label className="text-slate-500 font-semibold">Scope of Work:</label>
                                            <input type="text" value={invoiceForm.scope} onChange={e => setInvoiceForm({...invoiceForm, scope: e.target.value})} className="w-full mt-1 bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                        </div>
                                        <div>
                                            <label className="text-slate-500 font-semibold">Amount:</label>
                                            <input type="text" value={invoiceForm.amount} onChange={e => setInvoiceForm({...invoiceForm, amount: e.target.value})} className="w-full mt-1 bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* 2. Contracts */}
                        <div className="bg-white border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow p-6 rounded-3xl space-y-4">
                            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                <h2 className="text-xs font-bold text-indigo-600 uppercase tracking-wider flex items-center gap-2">
                                    <span>✍️</span> 2. Agreements & E-Signatures
                                </h2>
                                <button 
                                    onClick={() => {
                                        const title = prompt("Enter Agreement Title (e.g., NDA / Statement of Work):");
                                        const signedDate = prompt("Enter Execution Date (YYYY-MM-DD):", "2026-08-26");
                                        const status = prompt("Enter Status:", "Signed & Verified");
                                        if (title && signedDate) {
                                            fetch('/api/contract', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({ title, signedDate, status })
                                            }).then(() => loadData());
                                        }
                                    }}
                                    className="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-3 py-1.5 rounded-xl transition-colors">
                                    + Upload Agreement
                                </button>
                            </div>
                            <div className="space-y-3 text-sm text-slate-600 max-h-56 overflow-y-auto pr-1">
                                {data.contracts?.map(c => (
                                    <div key={c.id} className="bg-slate-50 border border-slate-200/60 p-3.5 rounded-2xl space-y-1">
                                        <p className="font-bold text-slate-900">{c.title}</p>
                                        <div className="flex justify-between items-center text-xs pt-1">
                                            <span className="text-slate-500">Executed: {c.signedDate}</span>
                                            <span className="bg-emerald-50 text-emerald-700 border border-emerald-200/60 font-bold px-2.5 py-1 rounded-xl">{c.status}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 3. Videos */}
                        <div className="bg-white border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow p-6 rounded-3xl space-y-4">
                            <div className="border-b border-slate-100 pb-3">
                                <h2 className="text-xs font-bold text-indigo-600 uppercase tracking-wider flex items-center gap-2">
                                    <span>🎬</span> 3. Video Creative Feedback
                                </h2>
                            </div>
                            <div className="space-y-3 text-sm text-slate-600">
                                {data.videos?.map(v => (
                                    <div key={v.id} className="bg-slate-50 border border-slate-200/60 p-4 rounded-2xl space-y-3">
                                        <div className="flex justify-between items-center">
                                            <span className="font-semibold text-slate-900 truncate max-w-[200px]">{v.title}</span>
                                            <span className={`text-xs font-bold px-3 py-1 rounded-xl ${
                                                v.status.includes('Approved') ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' :
                                                v.status.includes('Revision') ? 'bg-rose-50 text-rose-700 border border-rose-200' :
                                                'bg-amber-50 text-amber-800 border border-amber-200'
                                            }`}>
                                                {v.status}
                                            </span>
                                        </div>
                                        <div className="flex gap-2 pt-1">
                                            <button onClick={() => handleVideoStatus(v.id, 'Approved ✓')} className="flex-1 text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded-xl transition-colors shadow-sm">
                                                Approve
                                            </button>
                                            <button onClick={() => handleVideoStatus(v.id, 'Revision Requested ⚠️')} className="flex-1 text-xs bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold py-2 px-3 rounded-xl transition-colors">
                                                Request Change
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 4. Schedule */}
                        <div className="bg-white border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow p-6 rounded-3xl space-y-4">
                            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                <h2 className="text-xs font-bold text-indigo-600 uppercase tracking-wider flex items-center gap-2">
                                    <span>📅</span> 4. Content Calendar & Schedule
                                </h2>
                                <button 
                                    onClick={() => {
                                        const title = prompt("Enter Post Title / Topic:");
                                        const platform = prompt("Enter Platform (LinkedIn, TikTok, Meta):", "LinkedIn");
                                        const date = prompt("Enter Schedule Date & Time:", "Tomorrow at 9:00 AM AEST");
                                        if (title && platform && date) {
                                            fetch('/api/schedule', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({ platform, postTitle: title, scheduleDate: date, status: 'Ready' })
                                            }).then(() => loadData());
                                        }
                                    }}
                                    className="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-3 py-1.5 rounded-xl transition-colors">
                                    + Add Post
                                </button>
                            </div>
                            <div className="space-y-3 text-sm text-slate-600 max-h-56 overflow-y-auto pr-1">
                                {data.schedule?.map(s => (
                                    <div key={s.id} className="bg-slate-50 border border-slate-200/60 p-3.5 rounded-2xl flex justify-between items-start">
                                        <div>
                                            <span className="inline-block bg-indigo-100 text-indigo-800 text-[10px] font-extrabold px-2 py-0.5 rounded-lg mb-1">{s.platform}</span>
                                            <p className="font-semibold text-slate-900">{s.postTitle}</p>
                                            <p className="text-xs text-slate-400 mt-1">🕒 {s.scheduleDate}</p>
                                        </div>
                                        <span className="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold px-2.5 py-1 rounded-xl">
                                            {s.status || 'Ready'}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 5. Tasks */}
                        <div className="bg-white border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow p-6 rounded-3xl space-y-4">
                            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                <h2 className="text-xs font-bold text-indigo-600 uppercase tracking-wider flex items-center gap-2">
                                    <span>🚀</span> 5. Task & Project Milestones
                                </h2>
                                <button 
                                    onClick={() => {
                                        const title = prompt("Enter Task Title:");
                                        const priority = prompt("Enter Priority (High, Normal):", "High");
                                        if (title) {
                                            fetch('/api/tasks', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({ title, priority, status: 'In Progress' })
                                            }).then(() => loadData());
                                        }
                                    }}
                                    className="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-3 py-1.5 rounded-xl transition-colors">
                                    + Add Task
                                </button>
                            </div>
                            <div className="space-y-3 text-sm text-slate-600 max-h-56 overflow-y-auto pr-1">
                                {data.tasks?.map(t => (
                                    <div key={t.id} className="bg-slate-50 border border-slate-200/60 p-3.5 rounded-2xl flex justify-between items-center">
                                        <div>
                                            <span className="text-[10px] bg-rose-100 text-rose-800 font-bold px-2 py-0.5 rounded-lg mr-2">{t.priority}</span>
                                            <span className="font-semibold text-slate-900">{t.title}</span>
                                        </div>
                                        <button 
                                            onClick={() => handleTaskStatus(t.id, t.status === 'Completed ✓' ? 'In Progress' : 'Completed ✓')}
                                            className={`text-xs font-bold px-3 py-1.5 rounded-xl transition-colors ${
                                                t.status === 'Completed ✓' ? 'bg-emerald-100 text-emerald-800' : 'bg-indigo-600 text-white shadow-sm hover:bg-indigo-700'
                                            }`}>
                                            {t.status}
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 6. Leads & ROI */}
                        <div className="bg-white border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow p-6 rounded-3xl space-y-4 flex flex-col justify-between">
                            <div>
                                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                    <h2 className="text-xs font-bold text-indigo-600 uppercase tracking-wider flex items-center gap-2">
                                        <span>📊</span> 6. Lead Pipeline & ROI Analytics
                                    </h2>
                                    {!isEditingLeads ? (
                                        <button 
                                            onClick={() => {
                                                setLeadsForm({
                                                    qualifiedLeads: data.leads?.qualifiedLeads || '',
                                                    bookedCalls: data.leads?.bookedCalls || '',
                                                    roi: data.leads?.roi || ''
                                                });
                                                setIsEditingLeads(true);
                                            }}
                                            className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-xl transition-colors">
                                            Update Metrics
                                        </button>
                                    ) : (
                                        <div className="flex gap-2">
                                            <button onClick={() => setIsEditingLeads(false)} className="text-xs bg-slate-100 text-slate-600 font-semibold px-3 py-1.5 rounded-xl">Cancel</button>
                                            <button onClick={handleSaveLeads} className="text-xs bg-indigo-600 text-white font-semibold px-3 py-1.5 rounded-xl shadow-sm">Save</button>
                                        </div>
                                    )}
                                </div>

                                {!isEditingLeads ? (
                                    <div className="grid grid-cols-3 gap-3 text-center text-slate-700 pt-4">
                                        <div className="bg-slate-50 border border-slate-200/60 p-4 rounded-2xl">
                                            <span className="text-xs text-slate-400 block font-medium">Qualified</span>
                                            <strong className="text-base text-slate-900 mt-1 block">{data.leads?.qualifiedLeads}</strong>
                                        </div>
                                        <div className="bg-slate-50 border border-slate-200/60 p-4 rounded-2xl">
                                            <span className="text-xs text-slate-400 block font-medium">Calls Booked</span>
                                            <strong className="text-base text-slate-900 mt-1 block">{data.leads?.bookedCalls}</strong>
                                        </div>
                                        <div className="bg-emerald-50 border border-emerald-200/60 p-4 rounded-2xl">
                                            <span className="text-xs text-emerald-700 block font-medium">Campaign ROI</span>
                                            <strong className="text-base text-emerald-800 mt-1 block">{data.leads?.roi}</strong>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-3 pt-4 text-xs">
                                        <div>
                                            <label className="text-slate-500 font-semibold">Qualified Leads:</label>
                                            <input type="text" value={leadsForm.qualifiedLeads} onChange={e => setLeadsForm({...leadsForm, qualifiedLeads: e.target.value})} className="w-full mt-1 bg-slate-50 border border-slate-200 p-2.5 rounded-xl font-bold" />
                                        </div>
                                        <div>
                                            <label className="text-slate-500 font-semibold">Booked Calls:</label>
                                            <input type="text" value={leadsForm.bookedCalls} onChange={e => setLeadsForm({...leadsForm, bookedCalls: e.target.value})} className="w-full mt-1 bg-slate-50 border border-slate-200 p-2.5 rounded-xl font-bold" />
                                        </div>
                                        <div>
                                            <label className="text-slate-500 font-semibold">Campaign ROI:</label>
                                            <input type="text" value={leadsForm.roi} onChange={e => setLeadsForm({...leadsForm, roi: e.target.value})} className="w-full mt-1 bg-slate-50 border border-slate-200 p-2.5 rounded-xl font-bold" />
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                    </div>

                    {/* 7 & 8. Brand Asset Storage & Reporting Vault (Full Width) */}
                    <div className="bg-white border border-slate-200/80 shadow-sm p-6 md:p-8 rounded-3xl space-y-4">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                            <h2 className="text-xs font-bold text-indigo-600 uppercase tracking-wider flex items-center gap-2">
                                <span>📂</span> 7 & 8. Brand Asset Storage & Reporting Vault
                            </h2>
                            <button 
                                onClick={() => {
                                    const fileName = prompt("Enter File Name (e.g., Weekly_Report_Aug.pdf):");
                                    const fileSize = prompt("Enter File Size:", "3.5 MB");
                                    if (fileName) {
                                        fetch('/api/assets', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ fileName, fileSize })
                                        }).then(() => loadData());
                                    }
                                }}
                                className="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-3.5 py-2 rounded-xl transition-colors">
                                + Upload Asset
                            </button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                            {data.assets?.map(a => (
                                <div key={a.id} className="bg-slate-50 border border-slate-200/60 p-4 rounded-2xl flex justify-between items-center text-slate-700 hover:border-indigo-300 transition-all">
                                    <span className="font-semibold truncate max-w-[200px] text-slate-900">📄 {a.fileName}</span>
                                    <span className="text-xs bg-slate-200/80 text-slate-700 px-2.5 py-1 rounded-xl font-mono font-bold">{a.fileSize}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
